group "com.ryanheise.just_audio"
version "1.0"
def args = ["-Xlint:deprecation","-Xlint:unchecked"]

buildscript {
    ext {
        agp_version = '8.5.2'
    }
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:$agp_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

project.getTasks().withType(JavaCompile) {
    options.compilerArgs.addAll(args)
}

apply plugin: "com.android.library"

android {
    namespace "com.ryanheise.just_audio"

    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    defaultConfig {
        minSdk = 16
    }

    lintOptions {
        disable 'AndroidGradlePluginVersion', 'InvalidPackage', 'GradleDependency', 'NewerVersionAvailable'
    }

    // The host PCM harness uses Android's logging API; audio processing stays real.
    testOptions {
        unitTests.returnDefaultValues = true
    }
}
dependencies {
    def exoplayer_version = "1.4.1"
    implementation "androidx.media3:media3-exoplayer:$exoplayer_version"
    implementation "androidx.media3:media3-exoplayer-dash:$exoplayer_version"
    implementation "androidx.media3:media3-exoplayer-hls:$exoplayer_version"
    implementation "androidx.media3:media3-exoplayer-smoothstreaming:$exoplayer_version"
}

// Run the native PCM regression harnesses on the host JVM with Media3's real implementation.
// Test.classpath carries the Android/Media3 runtime jars and their build dependencies.
afterEvaluate {
    def checks = ['SpectrumAudioProcessorTest', 'AudioProcessorChainTest', 'LookaheadLimiterTest', 'TruePeakLimiterTest', 'LimiterBypassTest', 'NormalizationGainTest', 'CrossfadeClockTest', 'CrossfadeMixTest', 'CrossfadeHandoverTest', 'CrossfadeTimingTest', 'CrossfadeNormalizationTest', 'CrossfadeRealtimeTest', 'VoiceEnvelopeTest'].collect { testClass ->
        tasks.register("run${testClass}", JavaExec) {
            dependsOn 'compileDebugUnitTestJavaWithJavac'
            classpath = tasks.named('testDebugUnitTest').get().classpath
            mainClass = "com.ryanheise.just_audio.${testClass}"
            enableAssertions = true
        }
    }
    tasks.register('testPcmAudioProcessors') {
        group = 'verification'
        description = 'Tests native PCM startup, drains, sample preservation and limiting without a device.'
        dependsOn checks
    }
}
