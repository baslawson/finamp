name: Release Finamp+

# Builds a signed Android APK and publishes it as a GitHub release whenever a
# version tag (e.g. v1.1.0) is pushed. Needs the repository secrets
# ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  server-tests:
    name: Test server hub and audio jobs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            analyzer/requirements-loudness.txt
            analyzer/requirements-test.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libchromaprint-tools libsndfile1
      - run: pip install -r analyzer/requirements-loudness.txt -r analyzer/requirements-test.txt
      - name: Test isolated server behavior
        working-directory: analyzer
        run: python -m unittest discover -v
        env:
          DATA_DIR: ${{ runner.temp }}/finamp-server-test-data

  release-android:
    name: Build and publish signed APK
    needs: server-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - run: flutter pub get

      - name: Test app services
        run: flutter test --reporter compact

      - name: Test Party guest page and release retention
        run: node --test test/party_guest_page_test.js test/release_retention_test.js test/release_history_test.js

      - run: flutter build apk --release

      - name: Keep universal APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "finamp-plus-${GITHUB_REF_NAME}.apk"

      - name: Build phone ARM64 APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Keep ARM64 APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "finamp-plus-${GITHUB_REF_NAME}-arm64.apk"

      - name: Test native audio processors
        working-directory: android
        run: ./gradlew :just_audio:testPcmAudioProcessors :app:testArtworkPolicy --console=plain

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            finamp-plus-${{ github.ref_name }}.apk
            finamp-plus-${{ github.ref_name }}-arm64.apk
          generate_release_notes: true

      - name: Upload APK (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: finamp-plus-apk
          path: finamp-plus-*.apk

      - name: Remove signing key
        if: always()
        run: rm -f android/app/release.jks android/key.properties
