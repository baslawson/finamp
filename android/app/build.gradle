plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    compileSdkVersion flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = 17
    }

    defaultConfig {
        applicationId "com.baslawson.finampplus"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName

        // Single-target Flutter builds still include other ABIs from plugins.
        // Keep the phone APK's advertised CPUs aligned with its Flutter runtime,
        // without split APK version-code offsets that complicate upgrades.
        if (project.findProperty('target-platform') == 'android-arm64') {
            ndk {
                abiFilters.clear()
                abiFilters 'arm64-v8a'
            }
        }
    }
    signingConfigs {
        release {
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
        }
        def debugKeyStoreFile = keystoreProperties['debugKeystoreFile']
        if (debugKeyStoreFile != null) {
            debug {
                storeFile file(debugKeyStoreFile)
                storePassword keystoreProperties['debugKeystorePassword']
                keyAlias keystoreProperties['debugKeyAlias']
                keyPassword keystoreProperties['debugKeyPassword']
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            resValue "string", "app_name", "Finamp+"
            // shrinkResources false
            // minifyEnabled false
        }
        profile {
            if (signingConfigs.hasProperty('profile')) {
                signingConfig signingConfigs.profile
            }
            applicationIdSuffix '.profile'
            // minifyEnabled true // avoid dexing issues
            resValue "string", "app_name", "Finamp+ Profile"
        }
        debug {
            if (signingConfigs.hasProperty('debug')) {
                signingConfig signingConfigs.debug
            }
            applicationIdSuffix '.debug'
            // minifyEnabled true // avoid dexing issues
            resValue "string", "app_name", "Finamp+ Debug"
        }
    }
    namespace 'com.unicornsonlsd.finamp'
    lint {
        disable 'InvalidPackage'
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.mediarouter:mediarouter:1.8.1'
    implementation "androidx.core:core-splashscreen:1.2.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2"
}

afterEvaluate {
    tasks.register('testArtworkPolicy', JavaExec) {
        group = 'verification'
        description = 'Tests artwork file validation and bounded downloads without a device.'
        dependsOn 'compileDebugUnitTestJavaWithJavac'
        classpath = tasks.named('testDebugUnitTest').get().classpath
        mainClass = 'com.unicornsonlsd.finamp.ArtworkPolicyTest'
        enableAssertions = true
    }
}
