include: package:flutter_lints/flutter.yaml
formatter:
  page_width: 120
linter:
  rules:
    - unawaited_futures
    - always_declare_return_types
    - use_if_null_to_convert_nulls_to_bools
analyzer:
  plugins:
    - custom_lint
  exclude:
    - "lib/**/*.g.dart"
    - "lib/l10n/app_localizations*.dart"
    - lib/**.chopper.dart
    - lib/color_schemes.g.dart
    - build/**
    # Vendored as it was, so it's not held to this project's style.
    - packages/flutter_to_airplay/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
      strict-casts: true
      strict-inference: true
      strict-raw-types: true
  errors:
    collection_methods_unrelated_type: error